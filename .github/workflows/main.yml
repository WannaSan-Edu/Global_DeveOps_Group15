name: A workflow for my App
on: push

jobs:
  UnitTests:
    name: Unit Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Unit Tests
        run: mvn -Dtest=com.napier.sem.UnitTest test
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: UnitTests
          verbose: true

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Integration Tests
        env:
          WORLD_DB_URL: jdbc:mysql://localhost:33060/world?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          WORLD_DB_USER: root
          WORLD_DB_PASSWORD: example
        run: |
          docker build -t database ./db
          docker run --name world-db -dp 33060:3306 database
          for i in $(seq 1 30); do
            if docker exec world-db mysqladmin ping -h 127.0.0.1 -u root -pexample --silent; then
              break
            fi
            sleep 2
          done
          mvn -Dtest=com.napier.sem.AppIntegrationTest test
          docker stop world-db || true
          docker rm world-db || true
          docker image rm database || true
      - name: CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          flags: IntegrationTests
          verbose: true

  Build:
    name: Build and Start Using docker-compose
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Package and Run docker compose
        run: |
          mvn package -DskipTests
          docker compose up --abort-on-container-exit
      - name: view logs
        run: docker logs global_deveops_group15-app-1
